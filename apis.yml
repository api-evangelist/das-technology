apis:
- name: DAS Web API
  description: >-
    The DAS Web API (DASWebAPI) is DAS Technology's REST API for the CDXP platform, served from
    api.digitalairstrike.com and documented by two Swashbuckle-generated Swagger 2.0 documents
    published side by side: v1 (104 operations, 19 resource families) and v2 (32 operations, 8
    resource families). It covers dealership accounts and dealer-group hierarchy, online reviews
    and dealer responses, customer surveys and NPS, enterprise/review/survey/employee statistics
    rollups, transactional email and SMS with delivery-event polling, users and settings, vehicle
    and VIN lookup, sale and service transactions, and partner surfaces including SOCi
    provisioning, Zuora signature requests, incentives and media upload. Every operation requires
    a bearer token; the contract itself is anonymously readable.
  humanURL: https://api.digitalairstrike.com/swagger
  baseURL: https://api.digitalairstrike.com
