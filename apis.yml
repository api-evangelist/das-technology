image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/das-technology.png
name: DAS Technology
description: 'DAS Technology (formerly Digital Air Strike) is an automotive-retail marketing
  and customer-experience technology company serving more than 9,300 dealerships and
  OEMs. Its AI-native CDXP (Customer Data and Experience Platform) unifies sales, service,
  and retention data across three product lines: Attract (multi-channel digital advertising
  across Google, Facebook, Microsoft, Amazon, and TikTok), Convert (AI-powered lead
  response, instant quotes, and long-cycle nurturing), and Retain (reputation management,
  equity mining, and service-retention campaigns). DAS Technology ships a real REST API — the
  DAS Web API — served from its legacy Digital Air Strike domain and documented by two publicly
  readable Swagger 2.0 documents covering 136 operations across accounts and dealer-group
  hierarchy, reviews and reputation, surveys and NPS, enterprise statistics, transactional
  messaging, users, vehicles and transactions. The contract is discoverable but the program
  around it is not: there is no developer portal, no pricing, no SDK, no sandbox, no status page
  and no changelog, and access is arranged through the dealer, OEM or partner relationship.'
