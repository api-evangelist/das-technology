      - text/json
      - text/html
      produces:
      - application/xml
      - text/xml
      - application/json
      - text/json
      - text/html
      parameters:
      - name: accountGuid
        in: path
        description: A guid representing the account
        required: true
        type: string
        format: uuid
      - name: competitors
        in: body
        required: true
        schema:
          type: array
          items:
            $ref: '#/definitions/DAS.Models.AccountCompetitorModel'
      responses:
        '200':
          description: OK
          schema:
            type: object
