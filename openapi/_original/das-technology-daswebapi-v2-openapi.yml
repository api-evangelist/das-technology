      - text/xml
      - application/json
      - text/json
      - text/html
      parameters:
      - name: accountGuid
        in: path
        description: A uniqueidentifier representing an account.
        required: true
        type: string
        format: uuid
      - name: query.fromDate
        in: query
        required: true
        type: string
        format: date-time
      - name: query.toDate
        in: query
        required: false
        type: string
        format: date-time
      - name: query.categories
        in: query
        required: false
        type: array
        items:
          type: string
        collectionFormat: multi
      - name: query.reviewType
        in: query
        required: false
        type: array
        items:
          type: string
        collectionFormat: multi
      - name: query.source
        in: query
        required: false
        type: string
      - name: query.siteName
        in: query
        required: false
        type: string
      - name: query.disputedReview
        in: query
        required: false
        type: boolean
      - name: query.state
        in: query
        required: false
        type: string
      - name: query.hasResponse
        in: query
        required: false
        type: boolean
      - name: query.closedLoop
        in: query
        required: false
        type: boolean
      - name: query.brands
        in: query
        required: false
        type: array
        items:
          type: string
        collectionFormat: multi
      - name: query.orderBy
        in: query
        required: false
        type: string
      - name: query.page
        in: query
        required: false
        type: integer
        format: int32
      - name: query.pageSize
        in: query
        required: false
        type: integer
        format: int32
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/DAS.Models.PagedResult[DAS.Models.ReviewV2]'
