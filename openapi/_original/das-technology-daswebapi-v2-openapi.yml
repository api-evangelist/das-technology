          schema:
            $ref: '#/definitions/DAS.Models.AccountCompetitorModel'
    post:
      tags:
      - AccountV2
      summary: "Sets a list of account guids as the competitor list.  Duplicate accounts are suppressed.\r\
        \nIf an account guid does not exist, a 404 error will be returned."
      operationId: AccountV2_PostCompetitors
      consumes:
      - application/xml
      - text/xml
      - application/x-www-form-urlencoded
