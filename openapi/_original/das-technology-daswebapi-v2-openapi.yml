      summary: Generates a summary report of reputation statistics for a given account.
      operationId: AccountV2_GetReputationStatistics
      consumes: []
      produces:
      - application/xml
      - text/xml
      - application/json
      - text/json
      - text/html
      parameters:
      - name: accountGuid
        in: path
        description: A unique identifier representing an account
        required: true
        type: string
        format: uuid
      - name: fromDate
        in: query
        description: "A date time offset value representing the start date.  Time is represented in UTC.\
          \  Default value is -14 days if ToDate is specified, or -14\r\n            from current time\
          \ if no fromDate and toDate parameter is specified."
        required: true
        type: string
        format: date-time
      - name: toDate
        in: query
        description: "A date time offset value representing the end date.  Time is represented in UTC.\
          \  Default value is 14 days from fromDate if specified, or if\r\n            current time if\
          \ no fromDate or toDate parameter is specified."
        required: true
        type: string
        format: date-time
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/DAS.Models.ReputationStatisticsRootModel'
