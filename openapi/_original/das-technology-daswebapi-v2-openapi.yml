      - application/json
      - text/json
      - text/html
      produces:
      - application/xml
      - text/xml
      - application/json
      - text/json
      - text/html
      parameters:
      - name: accountGuid
        in: path
        description: A guid representing an account
        required: true
        type: string
        format: uuid
      - name: competitorAccountGuids
        in: body
        description: An array of guids representing the account competitors
        required: true
        schema:
          type: array
          items:
            format: uuid
            type: string
      responses:
        '200':
          description: OK
          schema:
            type: object
