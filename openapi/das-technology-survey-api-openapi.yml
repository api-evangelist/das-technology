openapi: 3.2.0
info:
  version: v1
  title: DASWebAPI V1 Survey API
servers:
- url: https://api.digitalairstrike.com
tags:
- name: Survey
paths:
  /v1/survey/{surveyId}/response:
    get:
      tags:
      - Survey
      summary: Retrieve survey responses by survey identifier
      operationId: Survey_GetSurveyResponsesAsync
      parameters:
      - name: surveyId
        in: path
        description: ''
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DAS.Models.SurveyResponseV2'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DAS.Models.SurveyResponseV2'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DAS.Models.SurveyResponseV2'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DAS.Models.SurveyResponseV2'
            text/html:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DAS.Models.SurveyResponseV2'
  /v1/survey/maritz/{maritzSurveyId}:
    get:
      tags:
      - Survey
      operationId: Survey_GetMaritzSurveyByMaritzSurveyId
      parameters:
      - name: maritzSurveyId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/xml:
              schema:
                type: object
            text/xml:
              schema:
                type: object
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            text/html:
              schema:
                type: object
  /v1/survey/accounts/{clientId}/smssurveys:
    post:
      tags:
      - Survey
      summary: Calls service.surveys on the new platform and sends a Mobile Review Surge survey via SMS to the given destination phone number.
      operationId: Survey_RequestSurvey
      parameters:
      - name: clientId
        in: path
        description: This is the Account GUID.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/xml:
              schema:
                type: object
            text/xml:
              schema:
                type: object
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            text/html:
              schema:
                type: object
      requestBody:
        content:
          application/xml:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/System.Collections.Generic.KeyValuePair_System.String_System.String'
          text/xml:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/System.Collections.Generic.KeyValuePair_System.String_System.String'
          application/x-www-form-urlencoded:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/System.Collections.Generic.KeyValuePair_System.String_System.String'
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/System.Collections.Generic.KeyValuePair_System.String_System.String'
          text/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/System.Collections.Generic.KeyValuePair_System.String_System.String'
          text/html:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/System.Collections.Generic.KeyValuePair_System.String_System.String'
        description: The collection of data in the Form.
        required: true
  /v1/survey/GetMobileSurveyStats:
    get:
      tags:
      - Survey
      summary: Returns just the stats, no surveys, broken up by intervals.
      operationId: Survey_GetMobileSurveyStatsAsync
      parameters:
      - name: token
        in: query
        description: The client or portal user GUID.
        required: true
        schema:
          type: string
          format: uuid
      - name: type
        in: query
        description: Used to determine if this is client or portal user GUID.
        required: true
        schema:
          type: string
      - name: timespan
        in: query
        description: 'Acceptable timespans are: 1w, 30d, 90d, 6m, 1y, hist. These match the front end''s filters.'
        required: false
        schema:
          type: string
      - name: interval
        in: query
        description: "It is ok to have a null interval as long as the front end sent us a timespan and not a fromDate and toDate.\n            Otherwise, an interval must be provided."
        required: false
        schema:
          type: string
      - name: fromCurrentDate
        in: query
        description: ''
        required: false
        schema:
          type: boolean
      - name: query.fromDate
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: query.toDate
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: query.categories
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: query.type
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: query.brands
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: query.q
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/xml:
              schema:
                type: object
            text/xml:
              schema:
                type: object
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            text/html:
              schema:
                type: object
  /v1/survey/{token}/ReviewSurgeReport:
    get:
      tags:
      - Survey
      summary: Get the ReviewSurgeReport and generate the csv file
      operationId: Survey_GetReviewSurgeReport
      parameters:
      - name: token
        in: path
        description: Account guid
        required: true
        schema:
          type: string
          format: uuid
      - name: query.fromDate
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: query.toDate
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: query.categories
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: query.reviewType
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: query.source
        in: query
        required: false
        schema:
          type: string
      - name: query.siteName
        in: query
        required: false
        schema:
          type: string
      - name: query.disputedReview
        in: query
        required: false
        schema:
          type: boolean
      - name: query.state
        in: query
        required: false
        schema:
          type: string
      - name: query.hasResponse
        in: query
        required: false
        schema:
          type: boolean
      - name: query.closedLoop
        in: query
        required: false
        schema:
          type: boolean
      - name: query.brands
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: query.orderBy
        in: query
        required: false
        schema:
          type: string
      - name: query.page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: query.pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/xml:
              schema:
                type: object
            text/xml:
              schema:
                type: object
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            text/html:
              schema:
                type: object
  /v1/survey/{token}/ReviewSurgeReportByWeek:
    get:
